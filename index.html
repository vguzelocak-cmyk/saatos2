<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Project Doruk-X | Injector</title>
    <style>
        /* Sayfanın havalı görünmesi için biraz stil */
        body { background-color: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding: 50px; }
        .console { border: 2px solid #0f0; padding: 20px; background: #111; display: inline-block; width: 80%; text-align: left; }
        button { background: #000; color: #0f0; border: 1px solid #0f0; padding: 10px 20px; cursor: pointer; margin: 10px; }
        button:hover { background: #0f0; color: #000; }
        .suc { color: #0f0; } .err { color: #f00; } .warn { color: #ff0; }
    </style>
</head>
<body>

    <div class="console">
        <h1>PROJECT DORUK-X</h1>
        <p>Sistem: FW 13.02 / 14.04</p>
        <hr>
        <button onclick="window.ready=true; log('Sızıntı taklit ediliyor... Portlar taranabilir.', 'suc')">1. SIZINTIYI ETKİNLEŞTİR</button>
        <button onclick="inject()">2. GOLDHEN'İ ENJEKTE ET</button>
        
        <div id="log-box" style="margin-top: 20px; height: 150px; overflow-y: auto;">
            > Sistem hazır. Lütfen adımları izleyin...
        </div>
    </div>

    <script>
        function log(m, t='') {
            const b = document.getElementById('log-box');
            b.innerHTML += `<div class="${t ? t : ''}">> ${m}</div>`;
        }

        async function inject() {
            if(!window.ready) {
                log("HATA: Önce 1. butona bas!", "err");
                return;
            }

            log("Sürekli Tarama Başlatıldı... Portlar denenecek.", "warn");

            try {
                const res = await fetch('goldhen_1302.bin');
                if(!res.ok) throw new Error("Dosya bulunamadı!");
                const payload = await res.arrayBuffer();
                const ports = [9020, 9021, 9090, 8080];

                for(let i=0; i<10; i++) {
                    log(`Deneme #${i+1}...`, "warn");
                    for(let p of ports) {
                        try {
                            const xhr = new XMLHttpRequest();
                            xhr.open('POST', `http://127.0.0.1:${p}/payload`, true);
                            xhr.timeout = 1000;
                            
                            xhr.onload = () => { 
                                log("BULDUM! SİSTEME GİRİLDİ!", "suc");
                                return; 
                            };
                            xhr.send(payload);
                        } catch(e) {}
                    }
                    await new Promise(r => setTimeout(r, 2000));
                }
                log("10 deneme bitti. Kapı hala kapalı.", "err");
            } catch(e) {
                log("HATA: " + e.message, "err");
            }
        }
    </script>
</body>
</html>
