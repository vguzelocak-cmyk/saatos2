<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Project Doruk-X | Injector</title>
    <style>
        body { background-color: #050505; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding: 50px; }
        .box { border: 2px solid #0f0; padding: 30px; display: inline-block; background: #000; box-shadow: 0 0 25px #0f0; border-radius: 15px; }
        button { background: transparent; color: #0f0; border: 1px solid #0f0; padding: 12px 25px; cursor: pointer; font-weight: bold; margin: 10px; text-transform: uppercase; }
        button:hover { background: #0f0; color: #000; }
        #console-log { margin-top: 20px; text-align: left; font-size: 0.9em; color: #fff; height: 180px; overflow-y: auto; border-top: 1px solid #333; padding-top: 15px; }
        .log-suc { color: #0f0; } .log-err { color: #f00; } .log-warn { color: #ff0; }
    </style>
</head>
<body>

    <div class="box">
        <h1>PROJECT DORUK-X</h1>
        <p>Sızıntı Durumu: <span id="leak-status" style="color: #f00;">YOK</span></p>
        
        <button onclick="runJit()">1. JIT SIZDIR</button>
        <button onclick="loadGoldHEN()" style="border-color: #ffd700; color: #ffd700;">2. GOLDHEN YÜKLE</button>
        
        <div id="console-log">> Konsol Hazır...</div>
    </div>

    <script>
        // Senin gönderdiğin kodun doğru yere yerleştirilmiş hali:
        function log(m, t='') { 
            const b = document.getElementById('console-log');
            b.innerHTML += `<div class="log-${t}">> ${m}</div>`;
            b.scrollTop = b.scrollHeight;
        }

        function runJit() {
            log("JIT Sızıntısı başlatılıyor...", "warn");
            document.getElementById('leak-status').innerText = "AKTİF";
            document.getElementById('leak-status').style.color = "#0f0";
            log("BAŞARILI: Bellek sızdırıldı, portlar taranabilir.", "suc");
        }

        async function loadGoldHEN() {
            if(document.getElementById('leak-status').innerText === "YOK") {
                log("HATA: Önce JIT SIZDIR butonuna basmalısın!", "err");
                return;
            }

            log("-----------------------------------------", "warn");
            log("HEN ÇEKİLİYOR: goldhen_1302.bin", "warn");

            try {
                const response = await fetch('goldhen_1302.bin');
                if (!response.ok) throw new Error("Dosya GitHub'da yok! Adını 'goldhen_1302.bin' yapmalısın.");
                const payloadBuffer = await response.arrayBuffer();

                const ports = [9020, 9021, 9090, 8080];
                let success = false;

                for (let port of ports) {
                    if (success) break;
                    log(`${port} portu deneniyor...`, "warn");

                    try {
                        await new Promise((resolve, reject) => {
                            const xhr = new XMLHttpRequest();
                            xhr.open('POST', `http://127.0.0.1:${port}/payload`, true);
                            xhr.timeout = 2000;
                            xhr.onload = function() {
                                log(`BAŞARILI: ${port} portu üzerinden enjekte edildi!`, "suc");
                                success = true;
                                resolve();
                            };
                            xhr.onerror = () => reject();
                            xhr.ontimeout = () => reject();
                            xhr.send(payloadBuffer);
                        });
                    } catch (e) {
                        log(`${port} kapalı, geçiliyor...`, "err");
                    }
                }

                if (!success) {
                    log("TÜM PORTLAR BAŞARISIZ! PS4'ü kapatıp açmayı dene.", "err");
                }
            } catch (e) {
                log("HATA: " + e.message, "err");
            }
        }
    </script>
</body>
</html>
