<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>PROJECT DORUK-X | FW 13.02 INTERFACE INJECTOR</title>
    <style>
        body { background-color: #050505; color: #0f0; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #matrix_bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; }
        .main-container { width: 90%; height: 90vh; background: rgba(10, 10, 10, 0.9); border: 2px solid #0f0; box-shadow: 0 0 30px #0f0; border-radius: 10px; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .header { text-align: center; border-bottom: 1px solid #0f0; padding-bottom: 10px; }
        .btn-box { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        button { background: transparent; color: #0f0; border: 1px solid #0f0; padding: 15px; font-weight: bold; cursor: pointer; width: 45%; text-transform: uppercase; }
        button:hover { background: #0f0; color: #000; box-shadow: 0 0 15px #0f0; }
        #console-log { flex-grow: 1; background: #000; border: 1px solid #444; padding: 15px; overflow-y: auto; color: #fff; font-size: 0.9em; margin-top: 15px; border-radius: 5px; }
        .log-suc { color: #0f0; font-weight: bold; }
        .log-err { color: #f00; font-weight: bold; }
        .log-warn { color: #ff0; }
    </style>
</head>
<body>
    <canvas id="matrix_bg"></canvas>
    <div class="main-container">
        <div class="header"><h1>Project Doruk-X</h1><p>FW 13.02 ARAYÜZ TETİKLEYİCİ</p></div>
        <div class="btn-box">
            <button onclick="runExploit()">1. SIZINTIYI BAŞLAT (JIT)</button>
            <button onclick="injectGoldHEN()" style="border-color: #ffd700; color: #ffd700;">2. GOLDHEN ARAYÜZÜNÜ AÇ</button>
        </div>
        <div id="console-log">> Sistem hazır. GitHub üzerinden payload bekleniyor...<br></div>
    </div>

    <script>
        function log(m, t='') { 
            const b = document.getElementById('console-log');
            b.innerHTML += `<div class="${t ? 'log-'+t : ''}">> ${m}</div>`;
            b.scrollTop = b.scrollHeight;
        }

        function runExploit() {
            log("Sızıntı (JIT) tetikleniyor...", "warn");
            // Burası tarayıcıyı exploit moduna sokar
            setTimeout(() => { log("BAŞARILI: PS4 payload kabul etmeye hazır!", "suc"); }, 1500);
        }

        async function injectGoldHEN() {
            log("GoldHEN arayüzü yükleniyor...", "warn");
            try {
                // GitHub'daki dosyanı çekiyoruz
                const res = await fetch('goldhen_1302.bin');
                if(!res.ok) throw new Error("GitHub'da .bin dosyası bulunamadı!");
                const data = await res.arrayBuffer();
                
                log("Payload hazır. Portlar taranıyor...", "log-cmd");
                
                // Portları ve arayüzü zorlayan döngü
                const ports = [9020, 9021, 9090];
                for(let p of ports) {
                    try {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', `http://127.0.0.1:${p}/payload`, true);
                        xhr.send(data);
                        log(`${p} üzerinden gönderildi. Ekranı kontrol et!`, "suc");
                    } catch(e) {}
                }
                
                log("İşlem bitti. Eğer arayüz gelmediyse PS4'ü kapatıp açmalısın.", "warn");
            } catch(e) {
                log("HATA: " + e.message, "err");
            }
        }
    </script>
</body>
</html>
