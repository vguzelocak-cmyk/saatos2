<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PS4 13.02 Research Protocol</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { border: 1px dashed #0f0; padding: 40px; text-align: center; background: #050505; }
        input { background: #000; border: 1px solid #0f0; color: #0f0; padding: 10px; width: 250px; margin-bottom: 20px; }
        button { background: #0f0; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; }
        #status { margin-top: 20px; font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div class="box">
    <h1>13.02 PROTOCOL v1.0</h1>
    <input type="text" id="pc_ip" value="192.168.1.22">
    <br>
    <button onclick="forceConnect()">BYPASS & CONNECT</button>
    <div id="status">Sinyal bekleniyor...</div>
</div>

<script>
function forceConnect() {
    var ip = document.getElementById('pc_ip').value;
    var status = document.getElementById('status');
    status.innerHTML = "Soket zorlanıyor...";

    // YÖNTEM 1: WebSocket (Bazı sürümlerde daha etkilidir)
    try {
        var ws = new WebSocket("ws://" + ip + ":9090");
        ws.onopen = function() { status.innerHTML = "BAĞLANDI!"; };
    } catch(e) {}

    // YÖNTEM 2: Image Beacon (Görünmez sızma)
    var b = new Image();
    b.src = "http://" + ip + ":9090/KERNEL_DUMP_START";

    // YÖNTEM 3: Script Tag (CSP Bypass)
    // Tarayıcı bir script yüklüyormuş gibi davranarak paket gönderir
    var s = document.createElement('script');
    s.src = "http://" + ip + ":9090/DORUK_SUCCESS.js";
    document.body.appendChild(s);

    status.innerHTML += "<br>3 farklı koldan paket fırlatıldı.";
}
</script>

</body>
</html>
