<!DOCTYPE html>
<html>
<head>
<title>PS4 13.02 Kernel Dumper</title>
<style>
    body { background-color: #1a1a1a; color: #00ff00; font-family: monospace; text-align: center; }
    #box { border: 2px solid #00ff00; padding: 20px; width: 400px; margin: 50px auto; border-radius: 10px; }
    input { background: #000; color: #00ff00; border: 1px solid #00ff00; padding: 10px; width: 80%; margin: 10px 0; }
    button { background: #00ff00; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
    button:hover { background: #00cc00; }
    #log { margin-top: 20px; text-align: left; padding: 10px; font-size: 12px; color: #00cc00; }
</style>
</head>
<body>

<div id="box">
    <h2>PS4 13.02 DUMPER</h2>
    <p>Bilgisayar IP Adresini Gir:</p>
    <input type="text" id="pc_ip" value="192.168.1.22">
    <br>
    <button onclick="startDump()">BAĞLANTIYI ATEŞLE</button>
    <div id="log">Durum: Bekliyor...</div>
</div>

<script>
function startDump() {
    var pc_ip = document.getElementById('pc_ip').value;
    var log = document.getElementById('log');
    
    log.innerHTML = "Ağ yolu kontrol ediliyor...";

    // 13.02 WebKit zorlaması için Image Objesi kullanıyoruz
    // Bu yöntem firewall'ları aşmada WebSocket'ten daha başarılıdır
    var img = new Image();
    
    img.onload = function() {
        log.innerHTML += "<br>[+] BAĞLANTI KURULDU!";
    };
    
    img.onerror = function() {
        // Netcat HTTP cevabı vermediği için buraya düşmesi normaldir
        // Ama terminalde IP'yi gördüysen bağlantı gitmiş demektir
        log.innerHTML += "<br>[?] Paket gönderildi. Terminale bak!";
    };

    // Netcat'e (nc) TCP üzerinden veri fırlatıyoruz
    img.src = "http://" + pc_ip + ":9090/ps4_dump?ver=1302&status=start";
    
    log.innerHTML += "<br>> Veri sızdırılıyor: " + pc_ip + ":9090";
}
</script>

</body>
</html>
