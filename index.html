<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 WebKit Test Panel</title>

<style>
body{
    background:#000;
    color:#0f0;
    font-family:Courier New, monospace;
    padding:20px;
}

.panel{
    border:1px solid #0f0;
    padding:15px;
    margin-bottom:10px;
    background:#050505;
}

button{
    background:#0f0;
    color:#000;
    border:none;
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0a0;
}

#log{
    height:200px;
    overflow-y:auto;
    border:1px solid #444;
    padding:10px;
    font-size:12px;
    color:#aaa;
}

.status{
    color:yellow;
}
</style>
</head>

<body>

<h1>PS4 WebKit Research Panel</h1>

<div class="panel">
<h3>Test Kontrolleri</h3>

<button onclick="triggerCrash()">Stack Overflow Testi</button>
<button onclick="location.reload()" style="background:red;">Sıfırla</button>

</div>

<div class="panel">
<h3>Durum: <span id="status" class="status">Beklemede...</span></h3>
<div id="log"></div>
</div>

<script>

const logBox = document.getElementById("log");
const statusText = document.getElementById("status");

function log(msg){
    let d = document.createElement("div");
    d.innerText = "["+ new Date().toLocaleTimeString() + "] " + msg;
    logBox.prepend(d);
}

function triggerCrash(){

    statusText.innerText = "Stack Overflow deneniyor...";
    log("Stack overflow testi başlatıldı");

    function recurse(){
        recurse();
    }

    try{
        recurse();
    }
    catch(e){
        log("Hata yakalandı: " + e.message);
        statusText.innerText = "Hata yakalandı";
    }

}

</script>

</body>
</html>
