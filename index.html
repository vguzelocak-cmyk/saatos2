    <script>
        function log(m, t='') { 
            const b = document.getElementById('console-log');

            b.scrollTop = b.scrollHeight;
        }

        // Belleği daha fazla zorlayan yeni sızıntı fonksiyonu
        function runAdvancedExploit() {
            log("Bellek baskısı oluşturuluyor...", "warn");
            
            // PS4 tarayıcısını hazırlamak için küçük bir döngü
            var spray = [];
            for(var i=0; i<100; i++) {

                window.leakReady = true;
            }, 2000);
        }

        async function loadGoldHEN() {
            if(!window.leakReady) {
                log("HATA: Önce 1. butona basıp 'BAŞARILI' yazısını görmelisin!", "err");
                return;
            }

            log("GitHub'dan Payload çekiliyor...", "warn");

                const response = await fetch('goldhen_1302.bin');
                if (!response.ok) throw new Error("Dosya bulunamadı! GitHub'da adı 'goldhen_1302.bin' mi?");
                const payloadBuffer = await response.arrayBuffer();

                // Daha geniş port taraması
                const ports = [9020, 9021, 9090, 8080, 1337];
                let success = false;

                for (let port of ports) {
                    if (success) break;
                    log(`Port ${port} deneniyor...`, "warn");

                        await new Promise((resolve, reject) => {
                            const xhr = new XMLHttpRequest();
                            xhr.open('POST', `http://127.0.0.1:${port}/payload`, true);

                                log(`KRİTİK BAŞARI: Port ${port} üzerinden gönderildi!`, "suc");
                                success = true;
                                resolve();
                            };
                            xhr.onerror = () => reject();
                            xhr.ontimeout = () => reject();
                            xhr.send(payloadBuffer);
                        });
                    } catch (e) {
                        // Port kapalıysa sessizce devam et
                    }
                }

                    log("TÜM PORTLAR KAPALI. Lütfen PS4'ü yeniden başlatıp tekrar dene.", "err");
